<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>K5 Bearing — Rotterdam weather channel</title>
  <meta name="description" content="A weather channel for Rotterdam: current conditions, forecast, alerts, tides, sun almanac, and space weather. From Kastle Five Systems.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Michroma&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <svg class="mark" viewBox="0 0 600 600" role="img" aria-label="K5 Bearing">
        <g fill="var(--ink)">
          <polygon points="300,300 300,268 409.6,190.4"/><polygon points="300,300 332,300 409.6,409.6"/>
          <polygon points="300,300 300,332 190.4,409.6"/><polygon points="300,300 268,300 190.4,190.4"/>
          <polygon points="300,300 270.3,270.3 300,65"/><polygon points="300,300 329.7,270.3 535,300"/>
          <polygon points="300,300 329.7,329.7 300,535"/><polygon points="300,300 270.3,329.7 65,300"/>
        </g>
      </svg>
      <span class="wordmark">K5&nbsp;Bearing</span>
    </div>
    <div class="place">
      <span class="city">Rotterdam</span>
      <span class="clock" id="clock">—</span>
    </div>
  </header>

  <main class="grid">
    <section class="tile now" id="now" aria-label="Current conditions">
      <div class="tile-title">Now</div>
      <div class="tile-body" data-state="loading">Loading…</div>
    </section>

    <section class="tile forecast" id="forecast" aria-label="Forecast">
      <div class="tile-title">Next days</div>
      <div class="tile-body" data-state="loading">Loading…</div>
    </section>

    <section class="tile alerts" id="alerts" aria-label="Severe-weather warnings">
      <div class="tile-title">Warnings</div>
      <div class="tile-body" data-state="pending">
        <div class="pending">Live Dutch warnings — <span>connecting soon</span></div>
      </div>
    </section>

    <section class="tile tides" id="tides" aria-label="Tides">
      <div class="tile-title">Tides · Hoek van Holland</div>
      <div class="tile-body" data-state="pending">
        <div class="pending">Tide predictions — <span>connecting soon</span></div>
      </div>
    </section>

    <section class="tile almanac" id="almanac" aria-label="Sun almanac">
      <div class="tile-title">Almanac</div>
      <div class="tile-body" data-state="loading">Loading…</div>
    </section>

    <section class="tile space" id="space" aria-label="Space weather">
      <div class="tile-title">Space weather · compass</div>
      <div class="tile-body" data-state="loading">Loading…</div>
    </section>
  </main>

  <footer class="footer">
    <span>Kastle Five Systems · Keep your bearing</span>
    <span class="sources">Open-Meteo · NOAA SWPC</span>
  </footer>

  <script src="app.js"></script>
</body>
</html>
